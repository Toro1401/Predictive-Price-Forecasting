name: Kronos Daily Forecast

on:
  schedule:
    # Runs every day at 02:00 UTC (04:00 CEST) -- before market open
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-kronos-base
          restore-keys: ${{ runner.os }}-hf-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run forecast and send newsletter
        env:
          KRONOS_EMAIL_SENDER: ${{ secrets.KRONOS_EMAIL_SENDER }}
          KRONOS_EMAIL_PASSWORD: ${{ secrets.KRONOS_EMAIL_PASSWORD }}
          KRONOS_EMAIL_RECIPIENT: ${{ secrets.KRONOS_EMAIL_RECIPIENT }}
        run: |
          python forecast_all.py --all --email --cloud

      - name: Upload forecast artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecasts-${{ github.run_number }}
          path: forecasts/
          retention-days: 30
